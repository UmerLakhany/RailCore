services:
  postgres:
    image: postgres:17
    container_name: railcore-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: railcore
      POSTGRES_PASSWORD: railcore_local_password
      POSTGRES_DB: railcore_db
    ports:
      - "5433:5432"
    volumes:
      - railcore_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U railcore -d railcore_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  railcore_postgres_data: