version: '3.8'
services:
  db:
    image: mysql:8.0
    container_name: railcore-db
    restart: always
    environment:
      MYSQL_DATABASE: railcore
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: railcoreuser
      MYSQL_PASSWORD: railcorepass
    ports:
      - "3306:3306"
    volumes:
      - db_data:/var/lib/mysql
volumes:
  db_data:
